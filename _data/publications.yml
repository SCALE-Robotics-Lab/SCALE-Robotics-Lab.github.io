# Item 2
- id: sheng2026arxiv
  image: /assets/img/publications/sheng2026arxiv.png
  title: "Beyond Partner Diversity: An Influence-Based Team Steering Framework for Zero-Shot Human-Machine Teaming"
  authors:
    - name: "Wei Sheng"
    - name: "Rohan Paleja"
  venue_short: "arXiv"
  venue_full: "arXiv CS."
  year: 2026
  bibtex: |
    @misc{sheng2026arxiv,
      title = {Beyond Partner Diversity: An Influence-Based Team Steering Framework for Zero-Shot Human-Machine Teaming},
      author = {Wei Sheng and Rohan Paleja},
      howpublished = {{arXiv} preprint {arXiv}:2605.15400},
      eprint = {2605.15400},
      archivePrefix = {arXiv},
      year = {2026},
      url = {https://arxiv.org/pdf/2605.15400}
    }
  badge_class: "pink darken-1"
  badge_url: "https://arxiv.org/archive/cs"
  links:
    - name: "Abstract"
      url: "#sheng2026arxiv-abstract"
    - name: "PDF"
      url: "https://arxiv.org/pdf/2605.15400"
  abstract: |
    While AI agents are rapidly advancing from isolated tools to interactive collaborators, data-driven human-machine teaming (HMT) methods remain costly in their reliance on human interaction data across domains, teammates, and team sizes. Zero-shot coordination (ZSC) addresses this bottleneck by simulating diverse partner populations to approximate how unseen partners might behave. However, partner coverage alone is insufficient as team settings scale and communication becomes degraded. To remedy this deficiency, we propose Influence-Based Team Steering (IBTS), a framework that uses influence shaping to incentivize agents to discover diverse, high-performing team interaction patterns and further steers ongoing trajectories toward stronger learned coordination modes. We assess IBTS on Overcooked-AI in both two-agent and three-agent settings, allowing us to test whether learned coordination structure transfers beyond dyadic interaction. Our evaluation includes simulated partners, synthetic partner-style variation, and, to our knowledge, the first 30-subject Overcooked-AI HMT study involving two real human teammates and one machine teammate. Across these evaluations, IBTS improves team performance against competing baselines, highlighting the need for scaled ZSC to combine sparse-reward coordination mechanisms with partner-variation coverage rather than relying on diversity alone.
  topics: [ "Human-Machine Teaming", "Multi-Agent Reinforcement Learning" ]
  selected: true
  equal_contribution: false

# Item 3
- id: sheng2026aims
  image: /assets/img/publications/sheng2026aims.png
  title: "Influence-Salient Coordination Shaping for Scalable Cooperative MARL"
  authors:
    - name: "Wei Sheng"
    - name: "Rohan Paleja"
  venue_short: "ICLR W."
  venue_full: "ICLR 2026 Workshop on AI for Mechanism Design and Strategic Decision Making"
  year: 2026
  bibtex: |
    @inproceedings{sheng2026aims,
      title = {Influence-Salient Coordination Shaping for Scalable Cooperative {MARL}},
      author = {Wei Sheng and Rohan Paleja},
      booktitle = {{ICLR} Workshop on {AI} for Mechanism Design and Strategic Decision Making},
      year = {2026},
      url = {https://openreview.net/pdf?id=DYhUVbmBFT}
    }
  badge_class: "pink darken-1"
  badge_url: "https://alimama-tech.github.io/aims-2026/#"
  links:
    - name: "Abstract"
      url: "#sheng2026aims-abstract"
    - name: "PDF"
      url: "https://openreview.net/pdf?id=DYhUVbmBFT"
  abstract: |
    Interaction-driven coordination is central to real-world teamwork, yet cooperative multi-agent reinforcement learning often struggles to induce it. This difficulty compounds as agent populations scale, since decentralized learning and weak credit assignment under combinatorial interaction structures can yield brittle, loosely coupled routines with limited mutual responsiveness. To tackle these challenges, we propose Influence-Salient Coordination Shaping (ISCS), a scalable shaping mechanism for learning team coordination in cooperative multi-agent systems. ISCS identifies influence-salient choices by selecting actions that maximize expected transition displacement in a learned representation space, then computes a directed, baseline-adjusted uplift-based shaping bonus that rewards actions increasing the likelihood of subsequent teammate coordination beyond what the joint observation alone predicts. To reduce timing sensitivity, ISCS optimizes uplift over a short-horizon coordination event rather than requiring an immediate next-step response, improving robustness to delayed responses and reducing spurious attribution from state-induced correlations. Experiments on challenging cooperative benchmarks show that adding ISCS to standard CTDE methods improves sample efficiency and final performance over strong baselines.
  topics: [ "Multi-Agent Reinforcement Learning", "Human-Machine Teaming" ]
  selected: true
  equal_contribution: false

# Item 4
- id: zoellner2026temporal
  image: /assets/img/publications/zoellner2026temporal.png
  title: "Temporal Logic Guidance for Action-Only Diffusion Policies with World Models"
  authors:
    - name: "Moritz Zoellner"
    - name: "Anastasios Manganaris"
    - name: "Rohan Paleja"
  venue_short: "ICRA W."
  venue_full: "ICRA 2026 Workshop on Bridging the Gap between Robot Learning and Human-Robot Interaction"
  year: 2026
  bibtex: |
    @inproceedings{zoellner2026temporal,
      title = {Temporal Logic Guidance for Action-Only Diffusion Policies with World Models},
      author = {Moritz Zoellner and Anastasios Manganaris and Rohan Paleja},
      booktitle = {{ICRA} Workshop on Bridging the Gap between Robot Learning and Human-Robot Interaction},
      year = {2026},
      url = {https://arxiv.org/pdf/2606.22729}
    }
  badge_class: "pink darken-1"
  badge_url: "https://sites.google.com/vt.edu/icra2026-learning-hri"
  links:
    - name: "Abstract"
      url: "#zoellner2026temporal-abstract"
    - name: "PDF"
      url: "https://arxiv.org/pdf/2606.22729"
  abstract: |
    Diffusion policies enable multimodal robot behavior but offer limited ability to choose among behavior modes at inference time, even though such control is desirable in human-robot settings. Prior solutions to this lack of control have utilized Signal Temporal Logic (STL) to express human intentions and provide corresponding guidance for diffusion policy inference. However, these approaches can only guide diffusion policies that jointly generate future actions and states, increasing both complexity and runtime. We propose a novel guidance method for action-only diffusion policies that uses a separate learned world model to enable differentiable evaluation of STL robustness, with its gradient then injected into the diffusion process. This steers behavior toward constraint satisfaction without retraining, improving constraint adherence while preserving task performance. On the Can Transport task from Robomimic, our method maintains 100% task success while reducing constraint violations from over 80% for baseline methods to 4%. We also discuss extensions toward improved robustness and more complex constraints.
  topics: [ "Robotics" ]
  selected: true
  equal_contribution: false

